# Site settings
title: Joao Jeronimo
email: jj2023@hw.ac.uk
description: >-
  Interested in labour economics, causal inference and the intersection between
  econometrics and machine learning.
baseurl: ""
url: "https://joaojeronimohw.github.io"

# Social / contact links rendered in the navbar
social:
  linkedin: "https://www.linkedin.com/in/jo%C3%A3o-jer%C3%B3nimo-hwu"
  github: "https://github.com/JoaoJeronimoHW"
  email: "jj2023@hw.ac.uk"

# Navbar
nav:
  - name: Home
    link: /
  - name: Resume
    link: /resume/
  - name: Blog
    link: /blog/
  - name: Research
    link: /research/

# Build settings
# Kramdown defaults are kept deliberately: the MathJax shim in
# _includes/custom-head.html expects kramdown's `script[type="math/tex"]` output.
markdown: kramdown

permalink: /blog/:year/:title/

plugins:
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .Rhistory
  - README.md
